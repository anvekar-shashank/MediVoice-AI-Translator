<div class="card settings-card">
                <div class="card-header">
                    <ion-icon name="options"></ion-icon>
                    <h3>System Settings</h3>
                </div>

                <div class="input-group">
                    <label><ion-icon name="key-outline"></ion-icon> Google Gemini API Key</label>
                    <input type="password" id="apiKeyInput" class="api-input" placeholder="Paste your API key here...">
                    <span class="supported">Stored securely in your browser. Never uploaded.</span>
                </div>

                <div class="input-group">
                    <label>Target Language</label>
                    <div class="select-wrapper">
                        <select id="languageSelect">
                            <option value="en-US">🇺🇸 English</option>
                            <option value="kn-IN">🇮🇳 Kannada (ಕನ್ನಡ)</option>
                            <option value="hi-IN">🇮🇳 Hindi (हिंदी)</option>
                            <option value="ta-IN">🇮🇳 Tamil (தமிழ்)</option>
                            <option value="te-IN">🇮🇳 Telugu (తెలుగు)</option>
                            <option value="ml-IN">🇮🇳 Malayalam (മലയാളം)</option>
                        </select>
                        <ion-icon name="chevron-down-outline" class="select-icon"></ion-icon>
                    </div>
                </div>

                <div class="engine-info">
                    <ion-icon name="hardware-chip-outline"></ion-icon>
                    <span>Powered by <strong>Gemini 3.1 Flash</strong></span>
                </div>

                <button id="translateBtn" class="btn-primary">
                    <ion-icon name="sparkles"></ion-icon> Analyze & Translate
                </button>
            </div>
